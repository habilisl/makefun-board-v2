<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>makefun board</title>
<style>
html{color-scheme:dark}
body{margin:0;background:#100e0c;color:#f4f0e6;font:16px/1.4 system-ui,sans-serif}
a{color:inherit;text-decoration:none}
header{display:flex;gap:16px;align-items:center;padding:12px 16px;position:sticky;top:0;background:#100e0c;border-bottom:1px solid #2e2922}
.brand{color:#ffb11a;font-weight:800}
nav a{font-weight:700;padding:6px 12px;border-radius:999px}
nav a.on,button.on{background:#ffb11a;color:#1a1408}
main{max-width:1040px;margin:auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.meta,label,.cat,.muted,th{color:#b7ad9c}
.meta{margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,select,input{font:inherit;color:inherit;background:#1b1814;border:1px solid #3a3428;border-radius:8px;padding:8px 10px;cursor:pointer}
input{flex:1;min-width:8rem}
table{width:100%;border-collapse:collapse}
th,td{text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:.72rem;text-transform:uppercase;}
td{padding:11px 8px;border-top:1px solid #2e2922}
tbody tr{cursor:pointer}
tbody tr:hover{background:#1c1915}
.pot{color:#ffb11a;font-size:1.75rem;font-weight:800}
time{font-weight:700}
.cat{margin-left:8px;font-size:.75rem}
img{width:20px;height:20px;border-radius:4px;vertical-align:-4px;margin-right:6px}
@media(max-width:720px){
thead{display:none}
tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:12px 0}
td{border:0;padding:0;text-align:left}
td:first-child{grid-column:1/-1}
.pot{font-size:1.9rem}
td[data-l]::before{content:attr(data-l);display:block;font-size:.68rem;font-weight:700;text-transform:uppercase}
}
</style>
</head>
<body>
<header>
  <a class="brand" href="#/">make.fun</a>
  <nav><a id="n" href="#/">Board</a></nav>
</header>
<main id="app"></main>
<script type="module">
const id=document.querySelector('main'),nav=document.getElementById('n');
let mode='live',cat='',q='',sort='pot',timer=0,token=0;
window.__shotReady=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>`&#${c.charCodeAt(0)};`);
const num=(v,d)=>(+v||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=v=>'$'+num(v,(+v||0)%1?2:0);
const pot=b=>+(b.potUsd??b.rewardAmount)||0;
const ahead=b=>new Date(b.deadline)>Date.now();
const left=iso=>{const ms=new Date(iso)-Date.now();if(!(ms>0))return'Ended';
const s=ms/1000|0,d=s/86400|0,p=n=>String(n).padStart(2,0);return(d?d+'d ':'')+p(s/3600%24|0)+':'+p(s/60%60|0)+':'+p(s%60)};
const pic=s=>{if(typeof s!='string'||!s)return'';if(s[0]=='/')s='https://make.fun'+s;return s.startsWith('https://')?`<img alt="" crossorigin=anonymous src="${esc(s)}">`:''};
async function comps(){const all=[];for(let i=0,c='';i<30;i++){const r=await fetch('https://make.fun/api/competitions?activity=times'+(c?'&cursor='+encodeURIComponent(c):''));if(!r.ok)throw 0;
const d=await r.json();all.push(...d.items||[]);if(!(c=d.next_cursor))break}return all}
const stop=()=>{clearInterval(timer);timer=0};
const row=b=>{const fee=+b.entryFeeUsd||0;return `<tr><td>${pic(b.sponsor&&b.sponsor.logo)}<a href="#/bounty/${encodeURIComponent(b.slug)}">${esc(b.title)}</a>${b.category?` <i class=cat>${esc(b.category)}</i>`:''}<td class=pot data-l=Pot>${usd(pot(b))}<td data-l=Fee${fee?'':' class=muted'}>${fee?usd(fee):'No fee'}<td data-l=Time><time datetime="${b.deadline}">${left(b.deadline)}</time><td data-l=Entries>${num(b.submissionCount,0)}`};
function draw(list){const query=q.trim().toLowerCase(),shown=list.filter(b=>ahead(b)==(mode=='live')&&(!cat||b.category==cat)&&(!query||[b.title,b.slug,b.category,b.summary].join(' ').toLowerCase().includes(query)));shown.sort((a,b)=>sort=='fee'?(+b.entryFeeUsd||0)-(+a.entryFeeUsd||0):sort=='entries'?(b.submissionCount||0)-(a.submissionCount||0):sort=='time'?(+new Date(a.deadline)-+new Date(b.deadline))*(mode=='done'?-1:1):pot(b)-pot(a));id.querySelector('#m').textContent=shown.length+' '+mode+' · '+usd(shown.reduce((s,b)=>s+pot(b),0))+' pots';id.querySelector('#rows').innerHTML=shown.map(row).join('')||'<tr><td colspan=5>No matches'}
function tick(list,g){if(g!=token)return;let dirty=0;for(const el of id.querySelectorAll('time')){const t=left(el.dateTime);el.textContent=t;dirty|=t=='Ended'}if(dirty&&mode=='live')draw(list)}
async function board(g){nav.className='on';id.innerHTML='<p class=meta>Loading…</p>';
const list=await comps();if(g!=token)return;
const cats=[...new Set(list.map(b=>b.category).filter(Boolean))].sort(),opt=(a,cur)=>a.map(s=>`<option value="${esc(s)}"${s==cur?' selected':''}>${esc(s[0].toUpperCase()+s.slice(1))}`).join('');id.innerHTML=`<h1>Board</h1><p class=meta id=m></p><div class=bar><button data-mode=live${mode=='live'?' class=on':''}>Live</button><button data-mode=done${mode=='done'?' class=on':''}>Done</button><select id=cat><option value="">All${opt(cats,cat)}</select><input id=q placeholder=Search value="${esc(q)}"><label>Sort <select id=sort>${opt(['pot','fee','time','entries'],sort)}</select></label></div><table><thead><tr><th>Bounty<th>Pot<th>Fee<th>Time<th>Entries<tbody id=rows></table>`;id.onclick=e=>{const m=e.target.dataset.mode;if(m){mode=m;for(const b of id.querySelectorAll('[data-mode]'))b.className=b.dataset.mode==mode?'on':'';draw(list);return}const a=e.target.closest('tr')?.querySelector('a');if(a&&!e.target.closest('a'))location.hash=a.getAttribute('href')};id.oninput=id.onchange=e=>{const k=e.target.id;if(k=='cat')cat=e.target.value;else if(k=='q')q=e.target.value;else if(k=='sort')sort=e.target.value;else return;draw(list)};draw(list);stop();timer=setInterval(()=>tick(list,g),1000);if(g==token)window.__shotReady=true}
async function go(){const g=++token;window.__shotReady=false;stop();nav.className='';id.onclick=id.oninput=id.onchange=null;let path='/';try{path=decodeURIComponent(location.hash.slice(1)||'/')}catch{}path=path.replace(/\/+$/,'')||'/';
const p=path.split('/').filter(Boolean);if(p.length)id.textContent='Loading…';try{if(p[0]=='bounty'&&p[2]=='leaderboard'&&!p[3]){const mod=await import('./ranks.js');await mod.show(p[1],id)}else if(p[0]=='bounty'&&p[1]&&!p[2]){const mod=await import('./bounty.js');await mod.show(p[1],id)}else if(p[0]=='u'&&p[1]&&!p[2]){const mod=await import('./user.js');await mod.show(p[1],id)}else if(!p.length){await board(g);return}else id.textContent='Not found.';if(g==token)window.__shotReady=true}catch{if(g!=token)return;id.textContent=p.length?'Not ready.':'Could not load.';window.__shotReady=true}}
addEventListener('hashchange',go);go();
</script>
</body>
</html>
