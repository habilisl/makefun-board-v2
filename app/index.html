<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>makefun board</title>
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#F7F3EF;color:#111111;font:16px/1.4 ui-rounded,system-ui,sans-serif}a{color:inherit;text-decoration:none}header{display:flex;gap:16px;align-items:center;padding:12px 16px;position:sticky;top:0;z-index:2;background:#F7F3EF;border-bottom:1px solid #0000001a}.brand{font-weight:800}.u{margin-left:8px;padding:1px 6px;border:1px solid #0000001a;border-radius:999px;color:#333;font-size:.68rem;font-weight:700;text-transform:uppercase}nav a{font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid #0000001a}nav a.on{background:#111111;color:#fff;border-color:#111111}main{max-width:1200px;margin:auto;padding:16px 16px 48px}h1{font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.03em}:focus-visible{outline:3px solid #111111;outline-offset:3px}button,select,input{font:inherit;color:#111111;background:#fff;border:1px solid #0000001a;border-radius:999px;padding:7px 12px}button{cursor:pointer}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%;margin-top:12px}input{flex:1;min-width:8rem}.games{--c:#FFB5C1}.code{--c:#B7E1D1}.growth{--c:#FFE59A}.trading{--c:#A9D3FF}.games,.code,.growth,.trading{background:var(--c)}[data-mode=live]{background:#B7E1D1}[data-mode=done]{background:#FFB5C1}.bar button.on{background:#111111;color:#fff;border-color:#111111}.go{display:inline-flex;align-items:center;gap:8px;background:#111111;color:#fff;border-radius:999px;padding:4px 4px 4px 12px;font-weight:800}.go i,.row i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;flex:none}.go i{background:#FFE59A;color:#111111}.go i:before,.row i:before{content:"→"}.blob{width:34px;height:26px;border-radius:50% 50% 42% 58%;border:1px solid #0000001a;display:inline-block;background:radial-gradient(circle at 32% 42%,#111111 2px,#0000 0),radial-gradient(circle at 64% 42%,#111111 2px,#0000 0),#fff}.grid{display:grid;gap:12px;grid-template-columns:1fr}.hero{position:relative;display:flex;flex-direction:column;background:#FFE59A;border:1px solid #0000001a;border-radius:20px;padding:16px 140px 14px 16px}.hero .blob{position:absolute;top:16px;right:16px;transform:scale(3.2);transform-origin:100% 0}.pot{font-weight:800;letter-spacing:-.03em;line-height:1}.hero .pot{font-size:clamp(2.2rem,6vw,3.4rem);margin:8px 0 0}.meta{color:#333;margin:4px 0 0}.rows{display:contents}a.card{display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--c,#fff);border:1px solid #0000001a;border-radius:20px;padding:14px;color:#111111}a.card img,.chip{align-self:flex-start}a.card .pot{font-size:1.7rem}.ttl{font-weight:800;line-height:1.2;max-height:2.4em;overflow:hidden;overflow-wrap:anywhere}.chip{width:max-content;background:#fff;border:1px solid #0000001a;border-radius:999px;padding:2px 8px;font-size:.72rem;font-weight:700;font-style:normal;color:#111111}.row{display:flex;gap:8px;align-items:center;color:#333;font-size:.82rem;margin-top:auto}.row time{color:#111111;font-weight:700}.row i{margin-left:auto;background:#111111;color:#fff}img{width:20px;height:20px;border-radius:6px;object-fit:cover}.empty{display:flex;gap:8px;align-items:center;color:#333;font-weight:700;grid-column:1/-1}@media(min-width:721px){.grid{grid-template-columns:1fr 1fr}.hero,.wide{grid-column:span 2}}@media(min-width:1001px){.grid{grid-template-columns:repeat(4,1fr)}.hero{grid-row:span 2}.hero .bar{margin-top:auto}}</style>
</head>
<body>
<header><a class="brand" href="#/">make.fun<span class=u>unofficial</span></a><nav><a id="n" href="#/">Board</a></nav></header>
<main id="app"></main>
<script type="module">
const id=document.querySelector('main'),nav=document.getElementById('n');
let mode='live',cat='',q='',sort='pot',timer=0,token=0;
window.__shotReady=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>`&#${c.charCodeAt(0)};`);
const num=(v,d)=>(+v||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=v=>'$'+num(v,(+v||0)%1?2:0);
const pot=b=>+(b.potUsd??b.rewardAmount)||0;
const ahead=b=>new Date(b.deadline)>Date.now();
const left=iso=>{const ms=new Date(iso)-Date.now();if(!(ms>0))return'Ended';
const s=ms/1000|0,d=s/86400|0,p=n=>String(n).padStart(2,0);return(d?d+'d ':'')+p(s/3600%24|0)+':'+p(s/60%60|0)+':'+p(s%60)};
const pic=s=>{if(typeof s!='string'||!s)return'';if(s[0]=='/')s='https://make.fun'+s;return s.startsWith('https://')?`<img alt="" crossorigin="anonymous" src="${esc(s)}">`:''};
const tone=c=>/^(games|code|growth|trading)$/i.test(c||'')?c.toLowerCase():'other';
const say=t=>{id.innerHTML=`<p class=empty><i class=blob></i> ${t}</p>`};
async function comps(){const all=[];for(let i=0,c='';i<30;i++){const r=await fetch('https://make.fun/api/competitions?activity=times'+(c?'&cursor='+encodeURIComponent(c):''));if(!r.ok)throw 0;
const d=await r.json();all.push(...d.items||[]);if(!(c=d.next_cursor))break}return all}
const stop=()=>{clearInterval(timer);timer=0};
const card=(b,i)=>{const fee=+b.entryFeeUsd||0,t=tone(b.category);return `<a class="card ${t}${i%5?'':' wide'}" href="#/bounty/${encodeURIComponent(b.slug)}">${pic(b.sponsor&&b.sponsor.logo)}${b.category?`<i class=chip>${esc(b.category)}</i>`:''}<b class=ttl>${esc(b.title)}</b><b class=pot>${usd(pot(b))}</b><span class=row><time datetime="${esc(b.deadline)}">${left(b.deadline)}</time><span>${fee?usd(fee):'No fee'}</span><span>${num(b.submissionCount,0)}</span><i></i></span></a>`};
function draw(list){const query=q.trim().toLowerCase(),shown=list.filter(b=>ahead(b)==(mode=='live')&&(!cat||b.category==cat)&&(!query||[b.title,b.slug,b.category,b.summary].join(' ').toLowerCase().includes(query)));shown.sort((a,b)=>sort=='fee'?(+b.entryFeeUsd||0)-(+a.entryFeeUsd||0):sort=='entries'?(b.submissionCount||0)-(a.submissionCount||0):sort=='time'?(+new Date(a.deadline)-+new Date(b.deadline))*(mode=='done'?-1:1):pot(b)-pot(a));
id.querySelector('#m').textContent=usd(shown.reduce((s,b)=>s+pot(b),0));id.querySelector('#c').textContent=shown.length+' '+mode;
let best=shown[0];for(const b of shown)if(pot(b)>pot(best))best=b;const top=id.querySelector('#top');
if(best){top.href='#/bounty/'+encodeURIComponent(best.slug);top.hidden=false}else top.hidden=true;
id.querySelector('#rows').innerHTML=shown.map(card).join('')||'<p class=empty><i class=blob></i> No matches</p>';
for(const b of id.querySelectorAll('[data-mode],[data-cat]'))b.classList.toggle('on',b.dataset.mode?b.dataset.mode==mode:b.dataset.cat==cat)}
function tick(list,g){if(g!=token)return;let dirty=0;for(const el of id.querySelectorAll('time')){const t=left(el.dateTime);el.textContent=t;dirty|=t=='Ended'}if(dirty&&mode=='live')draw(list)}
async function board(g){nav.className='on';say('Loading…');
const list=await comps();if(g!=token)return;
const cats=[...new Set(list.map(b=>b.category).filter(Boolean))].sort(),opt=(a,cur)=>a.map(s=>`<option value="${esc(s)}"${s==cur?' selected':''}>${esc(s[0].toUpperCase()+s.slice(1))}`).join('');
const chips=['',...cats].map(c=>`<button data-cat="${esc(c)}" class="${c?tone(c):''}">${esc(c||'All')}</button>`).join('');
id.innerHTML=`<div class=grid><section class=hero><i class=blob></i><h1>Win the next bounty</h1><b class=pot id=m></b><p class=meta id=c></p><div class=bar><button data-mode=live>Live</button><button data-mode=done>Done</button>${chips}<input id=q placeholder=Search value="${esc(q)}"><select id=sort>${opt(['pot','fee','time','entries'],sort)}</select><a class=go id=top>Biggest pot<i></i></a></div></section><div class=rows id=rows></div></div>`;
id.onclick=e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.mode)mode=t.dataset.mode;else if('cat'in t.dataset)cat=t.dataset.cat;else return;draw(list)};
id.oninput=id.onchange=e=>{const k=e.target.id;if(k=='q')q=e.target.value;else if(k=='sort')sort=e.target.value;else return;draw(list)};
draw(list);stop();timer=setInterval(()=>tick(list,g),1000);if(g==token)window.__shotReady=true}
async function go(){const g=++token;window.__shotReady=false;stop();nav.className='';id.onclick=id.oninput=id.onchange=null;let path='/';try{path=decodeURIComponent(location.hash.slice(1)||'/')}catch{}path=path.replace(/\/+$/,'')||'/';
const p=path.split('/').filter(Boolean);if(p.length)say('Loading…');try{if(p[0]=='bounty'&&p[2]=='leaderboard'&&!p[3]){const mod=await import('./ranks.js');await mod.show(p[1],id)}else if(p[0]=='bounty'&&p[1]&&!p[2]){const mod=await import('./bounty.js');await mod.show(p[1],id)}else if(p[0]=='u'&&p[1]&&!p[2]){const mod=await import('./user.js');await mod.show(p[1],id)}else if(!p.length){await board(g);return}else say('Not found.');if(g==token)window.__shotReady=true}catch{if(g!=token)return;say(p.length?'Not ready.':'Could not load.');window.__shotReady=true}}
addEventListener('hashchange',go);go();
</script>
</body>
</html>
